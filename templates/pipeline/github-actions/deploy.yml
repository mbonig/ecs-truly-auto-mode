# GENERATED by ecs-truly-auto-mode from .ecs-auto-mode/manifest.yaml
# Controlled by: pipeline
#
# Implements the shared deployment contract — see
# skills/ecs-truly-auto-mode/references/pipeline/contract.md
#
# Placeholders the generator substitutes:
#   {{APP_NAME}} {{BRANCH}} {{REGION}} {{ACCOUNT}} {{ROLE_ARN}} {{SSM_PREFIX}}
#   {{DOCKERFILE}} {{BUILD_CONTEXT}} {{DOCKER_PLATFORM}} {{PATH_FILTER}}
#   {{LOAD_BALANCED_FLAG}}

name: Deploy {{APP_NAME}}

on:
  push:
    branches: [{{BRANCH}}]
    # Derived from what the image build actually reads, plus the service stack
    # source. The platform stack is deliberately absent: this pipeline does not
    # deploy it, and a trigger that runs a pipeline which ignores the change is
    # worse than no trigger.
    paths:
{{PATH_FILTER}}
  workflow_dispatch:

# Serialize deploys to this environment. Two concurrent rollouts of the same service
# race on the ECS deployment and the loser's tasks are replaced mid-rollout.
concurrency:
  group: deploy-{{APP_NAME}}
  cancel-in-progress: false

permissions:
  # Required for OIDC. No AWS access key is stored as a repository secret.
  id-token: write
  contents: read

env:
  AWS_REGION: {{REGION}}
  SSM_PREFIX: {{SSM_PREFIX}}
  ECR_REPOSITORY: {{APP_NAME}}
  SERVICE_STACK: {{APP_NAME}}-service

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Assume deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: {{ROLE_ARN}}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-{{APP_NAME}}-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The image tag is the full commit SHA, never `latest`. A mutable tag would
      # leave the service stack template byte-identical between deploys, so
      # CloudFormation would see no change and the rollout would silently not happen.
      - name: Build and push
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker buildx build \
            --platform {{DOCKER_PLATFORM}} \
            --file {{DOCKERFILE}} \
            --tag "$IMAGE" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            {{BUILD_CONTEXT}}
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Fails naming the missing parameter, before anything has been changed.
      - name: Preflight platform parameters
        run: |
          chmod +x infra/scripts/ssm-preflight.sh
          ./infra/scripts/ssm-preflight.sh "$SSM_PREFIX" "$AWS_REGION" {{LOAD_BALANCED_FLAG}}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      # Only the service stack. The platform stack changes rarely, its changes are
      # worth a human looking at, and the deploy role has no permission to touch it.
      - name: Deploy service stack
        working-directory: infra
        run: |
          npx cdk deploy "$SERVICE_STACK" \
            --parameters "ImageTag=${{ github.sha }}" \
            --require-approval never \
            --progress events

      # A deploy that reports success while tasks crash-loop is worse than a failed
      # deploy, because nobody looks at it.
      - name: Wait for service to stabilize
        run: |
          CLUSTER="$(aws ssm get-parameter --name "$SSM_PREFIX/cluster-name" \
            --region "$AWS_REGION" --query 'Parameter.Value' --output text)"
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "{{APP_NAME}}" \
            --region "$AWS_REGION"

      - name: Summary
        if: always()
        run: |
          {
            echo "### {{APP_NAME}}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image tag | \`${{ github.sha }}\` |"
            echo "| Stack | \`$SERVICE_STACK\` |"
            echo "| Region | \`$AWS_REGION\` |"
          } >> "$GITHUB_STEP_SUMMARY"
