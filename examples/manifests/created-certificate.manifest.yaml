# Example manifest: the same stateless API as created-vpc, but served on a public
# hostname whose certificate is *created* rather than adopted.
#
# This is the manifest that pins down the create path for both resources that used
# to have only one: the ACM certificate is issued by the platform stack, DNS-validated
# against an adopted hosted zone, and the GitHub OIDC provider is created because the
# account has none. Nothing has to exist in AWS before the first platform deploy except
# the hosted zone, which the skill never creates.
schemaVersion: 1

app:
  name: shop-api
  dockerfile: Dockerfile
  buildContext: .

target:
  account: '071128183726'
  region: us-east-1
  ssmPrefix: /ecs-auto-mode/shop-api

analysis:
  buildValidated: true

  architecture:
    value: ARM64
    confidence: high
    evidence:
      - file: Dockerfile
        line: 1
        excerpt: 'FROM --platform=linux/arm64 node:22-alpine'

  container:
    port:
      value: 8080
      confidence: high
      evidence:
        - file: Dockerfile
          line: 14
          excerpt: 'EXPOSE 8080'
        - file: src/server.ts
          line: 22
          excerpt: 'app.listen(8080, () => ...)'
    healthCheck:
      type:
        value: http
        confidence: high
        evidence:
          - file: src/server.ts
            line: 11
            excerpt: "app.get('/health', (_req, res) => res.sendStatus(200))"
      path:
        value: /health
        confidence: high
        evidence:
          - file: src/server.ts
            line: 11
            excerpt: "app.get('/health', ...)"
          - file: test/health.test.ts
            line: 7
            excerpt: "expect(res.status).toBe(200)"

  egress:
    # No call in this app resolves outside the VPC, so the platform stack places the
    # service in isolated subnets and provisions no NAT gateway.
    classification:
      value: none
      confidence: high
      evidence:
        - file: src/server.ts
          excerpt: 'only route handlers and a logger; no outbound HTTP client'
        - file: package.json
          line: 12
          excerpt: 'dependencies contain no HTTP client or third-party SDK'
    awsServices:
      - ecr
      - ecr-docker
      - logs
    externalHosts: []

  hostnames:
    public:
      - value: shop.example.com
        confidence: high
        confirmedByUser: true
        evidence:
          - file: README.md
            line: 3
            excerpt: 'Production: https://shop.example.com'
    internal: []

  datastores: []

  config:
    environment:
      - name: LOG_LEVEL
        value: info
      - name: NODE_ENV
        value: production
    secrets: []

  buildContextPaths:
    - src/**
    - package.json
    - package-lock.json
    - tsconfig.json

plan:
  approved: true
  resources:
    - id: vpc
      action: create
      reason: No existing VPC supplied
    - id: nat-gateway
      action: skip
      reason: egress.classification is none — no outbound call leaves the VPC
    - id: vpc-endpoints
      action: create
      reason: Isolated subnets require interface endpoints for ECR and CloudWatch Logs
    - id: cluster
      action: create
      reason: No existing cluster supplied
    - id: ecr-repository
      action: create
      reason: No existing repository supplied
    - id: load-balancer
      action: create
      reason: Service accepts inbound HTTP on port 8080; internet-facing because a public hostname is recorded
    - id: target-group
      action: create
      reason: Required by the load balancer listener
    - id: log-group
      action: create
      reason: Task logging
    - id: task-role
      action: create
      reason: Required by the task definition
    - id: execution-role
      action: create
      reason: Required to pull the image and write logs
    - id: hosted-zone
      action: adopt
      identifiers:
        hostedZoneId: Z0123456789ABCDEFGHIJ
        zoneName: example.com
      reason: The skill does not create hosted zones — delegating nameservers at a registrar is outside what it can verify
      validated: true
    - id: certificate
      action: create
      reason: No certificate exists for shop.example.com; issued DNS-validated against the adopted zone rather than requiring one to exist before the first deploy
    - id: dns-record
      action: create
      reason: Alias record for shop.example.com into the adopted zone
    - id: github-oidc-role
      action: create
      reason: Pipeline target is github-actions
    - id: github-oidc-provider
      action: create
      reason: aws iam list-open-id-connect-providers returned no GitHub provider in this account
      validated: true

pipeline:
  target: github-actions
  branch: main
  repository: mbonig/shop-api
  roleArn: arn:aws:iam::071128183726:role/shop-api-deploy
  pathFilter:
    - src/**
    - package.json
    - package-lock.json
    - tsconfig.json
    - Dockerfile
    - infra/lib/service-stack.ts
